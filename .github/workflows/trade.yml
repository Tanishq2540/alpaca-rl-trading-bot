name: Alpaca AI Trading Bot

on:
  schedule:
    # Runs at 9:30 AM UTC, Monday through Friday
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install stable-baselines3 gymnasium yfinance pandas alpaca-py

      - name: Run live execution script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python alpaca_live_bot.py

      - name: Commit daily trade history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f trade_history.csv ]; then
            echo "trade_history.csv was not created; nothing to commit."
            exit 0
          fi
          git add trade_history.csv
          if git diff --cached --quiet; then
            echo "No trade history changes to commit."
            exit 0
          fi
          git commit -m "Auto-update daily trade history [skip ci]"
          git push
